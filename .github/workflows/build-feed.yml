name: Build feed

on:
  schedule:
    - cron: '30 * * * *'      # hourly
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node generate-feed.mjs
        env:
          SYMPLICITY_TOKEN: ${{ secrets.SYMPLICITY_TOKEN }}
          SITE_URL: https://USERNAME.github.io/REPO
      - uses: actions/configure-pages@v5            # bump to latest major
      - uses: actions/upload-pages-artifact@v3      # bump to latest major
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
